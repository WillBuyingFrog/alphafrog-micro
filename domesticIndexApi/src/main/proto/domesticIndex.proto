syntax = "proto3";

option java_multiple_files = true;

package world.willfrog.alphafrogmicro.domestic.idl;

/**
  指数基本信息
 */

/**
  指数基本信息--实体类消息
 */

// 包含所有（可能存在的）字段的消息
message DomesticIndexInfoFullItem {
  string tsCode = 1;
  string name = 2;
  string fullname = 3;
  string market = 4;
  optional string publisher = 5;
  optional string indexType = 6;
  optional string category = 7;
  optional int64 baseDate = 8;
  optional double basePoint = 9;
  optional double listDate = 10;
  optional string weightRule = 11;
  optional string desc = 12;
  optional int64 expDate = 13;
}


// 指数搜索场景下，只需要返回简单信息
message DomesticIndexInfoSimpleItem {
  string tsCode = 1;
  string name = 2;
  string fullname = 3;
  string market = 4;
}

/**
  指数基本信息-服务间通信用消息
 */

// 根据指数代码，查询指定指数的完整信息
message DomesticIndexInfoByTsCodeRequest {
  string tsCode = 1;
}

message DomesticIndexInfoByTsCodeResponse {
  DomesticIndexInfoFullItem item = 1;
}

// 搜索指数
message DomesticIndexSearchRequest {
  string query = 1;
}

message DomesticIndexSearchResponse {
  repeated DomesticIndexInfoSimpleItem items = 1;
}

// 获得所有指数基本信息
message DomesticIndexAllRequest {
  int32 offset = 1;
  int32 limit = 2;
}

message DomesticIndexAllResponse {
  repeated DomesticIndexInfoSimpleItem items = 1;
}


/**
  指数行情--实体类消息
 */

message DomesticIndexDailyItem {
  string tsCode = 1;
  int64 tradeDate = 2;
  double close = 3;
  optional double open = 4;
  optional double high = 5;
  optional double low = 6;
  double preClose = 7;
  double change = 8;
  double pctChg = 9;
  optional double vol = 10;
  optional double amount = 11;
}

/**
  指数行情--服务间通信用消息
 */

// 根据时间范围获取单一指数行情
message DomesticIndexDailyByTsCodeAndDateRangeRequest {
  string tsCode = 1;
  int64 startDate = 2;
  int64 endDate = 3;
}

message DomesticIndexDailyByTsCodeAndDateRangeResponse {
  repeated DomesticIndexDailyItem items = 1;
  bool complete = 2;
  int32 expectedTradingDays = 3;
  int32 actualTradingDays = 4;
  int32 missingCount = 5;
  repeated int64 missingDates = 6;
  bool upstreamGap = 7;
}

// 交易日数量查询
message DomesticTradingDaysCountRequest {
  string exchange = 1;
  int64 startDate = 2;
  int64 endDate = 3;
}

message DomesticTradingDaysCountResponse {
  string exchange = 1;
  int64 startDate = 2;
  int64 endDate = 3;
  int32 tradingDaysCount = 4;
}

/**
  指数成分股--实体类消息
 */

message DomesticIndexWeightItem {
  string indexCode = 1;
  string conCode = 2;
  int64 tradeDate = 3;
  double weight = 4;
}

/**
  指数成分股--服务间通信用消息
 */


// 获取某个指数在某段时间内的成分股
message DomesticIndexWeightByTsCodeAndDateRangeRequest {
  string tsCode = 1;
  int64 startDate = 2;
  int64 endDate = 3;
}

message DomesticIndexWeightByTsCodeAndDateRangeResponse {
  repeated DomesticIndexWeightItem items = 1;
}

// 获取某只股票在某段时间内是哪些指数的成分股

message DomesticIndexWeightByConCodeAndDateRangeRequest {
  string conCode = 1;
  int64 startDate = 2;
  int64 endDate = 3;
}

message DomesticIndexWeightByConCodeAndDateRangeResponse {
  repeated DomesticIndexWeightItem items = 1;
}


/**
  指数数据爬取服务
 */


// 按照交易所或服务商爬取指数基本信息
message DomesticIndexInfoFetchByMarketRequest {
  string market = 1;
  int32 offset = 2;
  int32 limit = 3;
}

message DomesticIndexInfoFetchByMarketResponse {
  string status = 1;
  int32 fetchedItemsCount = 2;
}

// 按照交易日范围爬取指定指数行情
message DomesticIndexDailyFetchByDateRangeRequest {
  string tsCode = 1;
  int64 startDate = 2;
  int64 endDate = 3;
  int32 offset = 4;
  int32 limit = 5;
}

message DomesticIndexDailyFetchByDateRangeResponse {
  string status = 1;
  int32 fetchedItemsCount = 2;
}

// 按照指定交易日爬取所有指数行情
message DomesticIndexDailyFetchByTradeDateRequest {
  int64 tradeDate = 1;
  int32 offset = 2;         // TuShare 分页偏移（向后兼容）
  int32 limit = 3;          // TuShare 分页限制（向后兼容）
  int32 indexOffset = 4;    // 本地指数库分批偏移
  int32 indexLimit = 5;     // 本地指数库分批大小
  int32 apiOffsetStart = 6; // TuShare 分页起始 offset
  int32 apiOffsetEnd = 7;   // TuShare 分页结束 offset
  int32 apiOffsetStep = 8;  // TuShare 分页步长
}

message DomesticIndexDailyFetchByTradeDateResponse {
  string status = 1;
  int32 fetchedItemsCount = 2;
}

// 按照指定交易日范围爬取所有指数行情
message DomesticindexDailyFetchAllByDateRangeRequest {
  int64 startDate = 1;
  int64 endDate = 2;
  int32 offset = 3;         // TuShare 分页偏移（向后兼容）
  int32 limit = 4;          // TuShare 分页限制（向后兼容）
  int32 indexOffset = 5;    // 本地指数库分批偏移
  int32 indexLimit = 6;     // 本地指数库分批大小
  int32 apiOffsetStart = 7; // TuShare 分页起始 offset
  int32 apiOffsetEnd = 8;   // TuShare 分页结束 offset
  int32 apiOffsetStep = 9;  // TuShare 分页步长
}

message DomesticIndexDailyFetchAllByDateRangeResponse {
  string status = 1;
  int32 fetchedItemsCount = 2;
}

// 按照交易日范围爬取指数成分股
message DomesticIndexWeightFetchByDateRangeRequest {
  int64 startDate = 1;
  int64 endDate = 2;
  int32 offset = 3;         // TuShare 分页偏移（向后兼容）
  int32 limit = 4;          // TuShare 分页限制（向后兼容）
  int32 indexOffset = 5;    // 本地指数库分批偏移
  int32 indexLimit = 6;     // 本地指数库分批大小
  int32 apiOffsetStart = 7; // TuShare 分页起始 offset
  int32 apiOffsetEnd = 8;   // TuShare 分页结束 offset
  int32 apiOffsetStep = 9;  // TuShare 分页步长
}

message DomesticIndexWeightFetchByDateRangeResponse {
  string status = 1;
  int32 fetchedItemsCount = 2;
}


/**
  交易日历爬取服务
 */

// 按照日期范围爬取交易日历
message DomesticTradeCalendarFetchByDateRangeRequest {
  int64 startDate = 1;
  int64 endDate = 2;
  int32 offset = 3;
  int32 limit = 4;
}

message DomesticTradeCalendarFetchByDateRangeResponse {
  string status = 1;
  int32 fetchedItemsCount = 2;
}


service DomesticIndexService{
  // 根据指数代码查询指数信息
  rpc getDomesticIndexInfoByTsCode(DomesticIndexInfoByTsCodeRequest) returns (DomesticIndexInfoByTsCodeResponse);
  // 根据关键词查询指数
  rpc searchDomesticIndex(DomesticIndexSearchRequest) returns (DomesticIndexSearchResponse);
  // 根据代码和时间范围查询指数日线行情
  rpc getDomesticIndexDailyByTsCodeAndDateRange(DomesticIndexDailyByTsCodeAndDateRangeRequest) returns (DomesticIndexDailyByTsCodeAndDateRangeResponse);
  // 根据交易日查询所有指数日线行情
  rpc getDomesticIndexDailyByTradeDate(DomesticIndexDailyByTsCodeAndDateRangeRequest) returns (DomesticIndexDailyByTsCodeAndDateRangeResponse);
  // 根据日期范围查询交易日数量
  rpc getTradingDaysCountByDateRange(DomesticTradingDaysCountRequest) returns (DomesticTradingDaysCountResponse);
  // 根据代码和时间范围查询指数成分股
  rpc getDomesticIndexWeightByTsCodeAndDateRange(DomesticIndexWeightByTsCodeAndDateRangeRequest) returns (DomesticIndexWeightByTsCodeAndDateRangeResponse);
  // 根据指定股票代码查询所有含有此股票的指数
  rpc getDomesticIndexWeightByConCodeAndDateRange(DomesticIndexWeightByConCodeAndDateRangeRequest) returns (DomesticIndexWeightByConCodeAndDateRangeResponse);

}

/**
  大盘指数每日估值指标爬取
 */

// 按指数代码和日期范围爬取大盘指数每日估值指标
message DomesticIndexDailyBasicFetchByTsCodeRequest {
  string tsCode = 1;
  string startDate = 2;
  string endDate = 3;
  int32 offset = 4;
  int32 limit = 5;
}

message DomesticIndexDailyBasicFetchByTsCodeResponse {
  string status = 1;
  int32 fetchedItemsCount = 2;
}

// 按交易日期爬取大盘指数每日估值指标
message DomesticIndexDailyBasicFetchByTradeDateRequest {
  string tradeDate = 1;
  int32 offset = 2;
  int32 limit = 3;
}

message DomesticIndexDailyBasicFetchByTradeDateResponse {
  string status = 1;
  int32 fetchedItemsCount = 2;
}

// 按日期范围爬取全部大盘指数估值指标（批量历史数据初始化）
message DomesticIndexDailyBasicFetchAllByDateRangeRequest {
  string startDate = 1;
  string endDate = 2;
  int32 offset = 3;
  int32 limit = 4;
}

message DomesticIndexDailyBasicFetchAllByDateRangeResponse {
  string status = 1;
  int32 fetchedItemsCount = 2;
}

/**
  申万行业分类爬取
 */

message DomesticSwIndustryClassifyFetchRequest {
  string level = 1;
  string src = 2;
}

message DomesticSwIndustryClassifyFetchResponse {
  string status = 1;
  int32 fetchedItemsCount = 2;
}

/**
  申万行业成分爬取
 */

message DomesticSwIndustryMemberFetchByL1CodeRequest {
  string l1Code = 1;
  string l2Code = 2;
  string l3Code = 3;
  string tsCode = 4;
  string isNew = 5;
  int32 offset = 6;
  int32 limit = 7;
}

message DomesticSwIndustryMemberFetchByL1CodeResponse {
  string status = 1;
  int32 fetchedItemsCount = 2;
}

/**
  申万行业指数日线行情爬取
 */

message DomesticSwIndustryDailyFetchByTradeDateRequest {
  string tradeDate = 1;
  int32 offset = 2;
  int32 limit = 3;
}

message DomesticSwIndustryDailyFetchByTradeDateResponse {
  string status = 1;
  int32 fetchedItemsCount = 2;
}

message DomesticSwIndustryDailyFetchByTsCodeRequest {
  string tsCode = 1;
  string startDate = 2;
  string endDate = 3;
  int32 offset = 4;
  int32 limit = 5;
}

message DomesticSwIndustryDailyFetchByTsCodeResponse {
  string status = 1;
  int32 fetchedItemsCount = 2;
}

// 按日期范围爬取全部申万行业日线（批量历史数据初始化）
message DomesticSwIndustryDailyFetchAllByDateRangeRequest {
  string startDate = 1;
  string endDate = 2;
  int32 offset = 3;
  int32 limit = 4;
}

message DomesticSwIndustryDailyFetchAllByDateRangeResponse {
  string status = 1;
  int32 fetchedItemsCount = 2;
}

/**
  中信行业成分爬取（注意：不是中证指数，是中信行业分类）
 */

message DomesticCiIndexMemberFetchRequest {
  string l1Code = 1;
  string l2Code = 2;
  string l3Code = 3;
  string tsCode = 4;
  string isNew = 5;
  int32 offset = 6;
  int32 limit = 7;
}

message DomesticCiIndexMemberFetchResponse {
  string status = 1;
  int32 fetchedItemsCount = 2;
}

/**
  中信行业指数日线行情爬取（ci_daily）
  对应 TuShare 接口：ci_daily，doc_id=308
 */

message DomesticCiIndustryDailyFetchRequest {
  string tsCode = 1;
  string tradeDate = 2;
  string startDate = 3;
  string endDate = 4;
  int32 offset = 5;
  int32 limit = 6;
}

message DomesticCiIndustryDailyFetchResponse {
  string status = 1;
  int32 fetchedItemsCount = 2;
}

// 按日期范围爬取全部中信行业日线（批量历史数据初始化）
message DomesticCiIndustryDailyFetchAllByDateRangeRequest {
  string startDate = 1;
  string endDate = 2;
  int32 offset = 3;
  int32 limit = 4;
}

message DomesticCiIndustryDailyFetchAllByDateRangeResponse {
  string status = 1;
  int32 fetchedItemsCount = 2;
}


service DomesticIndexFetchService {
  rpc fetchDomesticIndexInfoByMarket(DomesticIndexInfoFetchByMarketRequest) returns (DomesticIndexInfoFetchByMarketResponse);
  rpc fetchDomesticIndexDailyByDateRange(DomesticIndexDailyFetchByDateRangeRequest) returns (DomesticIndexDailyFetchByDateRangeResponse);
  rpc fetchDomesticIndexDailyByTradeDate(DomesticIndexDailyFetchByTradeDateRequest) returns (DomesticIndexDailyFetchByTradeDateResponse);
  rpc fetchDomesticIndexDailyAllByDateRange(DomesticindexDailyFetchAllByDateRangeRequest) returns (DomesticIndexDailyFetchAllByDateRangeResponse);
  rpc fetchDomesticIndexWeightByDateRange(DomesticIndexWeightFetchByDateRangeRequest) returns (DomesticIndexWeightFetchByDateRangeResponse);
  rpc fetchIndexDailyBasicByTsCode(DomesticIndexDailyBasicFetchByTsCodeRequest) returns (DomesticIndexDailyBasicFetchByTsCodeResponse);
  rpc fetchIndexDailyBasicByTradeDate(DomesticIndexDailyBasicFetchByTradeDateRequest) returns (DomesticIndexDailyBasicFetchByTradeDateResponse);
  // 批量拉取全部指数估值（历史数据初始化）
  rpc fetchIndexDailyBasicAllByDateRange(DomesticIndexDailyBasicFetchAllByDateRangeRequest) returns (DomesticIndexDailyBasicFetchAllByDateRangeResponse);
  rpc fetchSwIndustryClassify(DomesticSwIndustryClassifyFetchRequest) returns (DomesticSwIndustryClassifyFetchResponse);
  rpc fetchSwIndustryMemberByL1Code(DomesticSwIndustryMemberFetchByL1CodeRequest) returns (DomesticSwIndustryMemberFetchByL1CodeResponse);
  rpc fetchSwIndustryDailyByTradeDate(DomesticSwIndustryDailyFetchByTradeDateRequest) returns (DomesticSwIndustryDailyFetchByTradeDateResponse);
  rpc fetchSwIndustryDailyByTsCode(DomesticSwIndustryDailyFetchByTsCodeRequest) returns (DomesticSwIndustryDailyFetchByTsCodeResponse);
  // 批量拉取全部申万行业日线（历史数据初始化）
  rpc fetchSwIndustryDailyAllByDateRange(DomesticSwIndustryDailyFetchAllByDateRangeRequest) returns (DomesticSwIndustryDailyFetchAllByDateRangeResponse);
  rpc fetchCiIndexMember(DomesticCiIndexMemberFetchRequest) returns (DomesticCiIndexMemberFetchResponse);
  rpc fetchCiIndustryDaily(DomesticCiIndustryDailyFetchRequest) returns (DomesticCiIndustryDailyFetchResponse);
  // 批量拉取全部中信行业日线（历史数据初始化）
  rpc fetchCiIndustryDailyAllByDateRange(DomesticCiIndustryDailyFetchAllByDateRangeRequest) returns (DomesticCiIndustryDailyFetchAllByDateRangeResponse);
}

service DomesticTradeCalendarFetchService {
  rpc fetchDomesticTradeCalendarByDateRange(DomesticTradeCalendarFetchByDateRangeRequest) returns (DomesticTradeCalendarFetchByDateRangeResponse);
}
