spring:
  application:
    name: domestic-fetch-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${AF_DB_MAIN_HOST}:${AF_DB_MAIN_PORT}/${AF_DB_MAIN_DATABASE}
    username: ${AF_DB_MAIN_USER}
    password: ${AF_DB_MAIN_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
  rabbitmq:
    host: ${AF_RABBITMQ_HOST:localhost}
    port: ${AF_RABBITMQ_PORT:5672}
    username: ${AF_RABBITMQ_USER:guest}
    password: ${AF_RABBITMQ_PASS:guest}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 2
  data:
    redis:
      host: ${AF_REDIS_HOST:127.0.0.1}
      port: 6379
      password: ${AF_REDIS_PASSWORD:default}

af:
  fetch:
    concurrency: ${AF_FETCH_CONCURRENCY:3}
    jobs:
      config-file: ${AF_FETCH_JOBS_CONFIG_FILE:}
      config-refresh-interval-ms: ${AF_FETCH_JOBS_CONFIG_REFRESH_INTERVAL_MS:60000}

alphafrog:
  config:
    nacos:
      enabled: ${AF_CONFIG_NACOS_ENABLED:false}
      server-addr: ${NACOS_ADDRESS:127.0.0.1}:8848
      namespace: ${AF_CONFIG_NACOS_NAMESPACE:}
      group: ${AF_CONFIG_NACOS_GROUP:alphafrog-config}
      subscriptions:
        - data-id: ${AF_CONFIG_NACOS_FETCH_JOBS_DATA_ID:fetch-jobs.json}
          group: ${AF_CONFIG_NACOS_GROUP:alphafrog-config}
          target-file: ${AF_FETCH_JOBS_CONFIG_FILE:}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    world.willfrog.alphafrogmicro: ${LOGGING_LEVEL_APP:DEBUG}

mybatis:
  configuration:
    map-underscore-to-camel-case: true


dubbo:
  application:
    name: domestic-fetch-service
    # 当前集群沿用 Dubbo 2 风格的接口级服务发现，显式关闭 Dubbo 3 默认的应用级双注册/双订阅
    register-mode: interface
  registry:
    address: nacos://${NACOS_ADDRESS:127.0.0.1}:8848?username=${NACOS_USER:nacos}&password=${NACOS_PASSWORD:nacos}
    # 当前未使用 Nacos 作为 Dubbo 配置中心，显式关闭默认兜底，避免启动时额外做 config-center 健康检查
    use-as-config-center: false
    # 当前未使用 Nacos 作为 Dubbo 元数据中心，显式关闭默认兜底，避免启动时额外做 metadata-center 健康检查
    use-as-metadata-center: false
    simplified: true  # 简化注册信息，避免metadata超过1024字符限制
  protocol:
    port: 20882
    name: tri
  provider:
    simplify: true    # 简化provider元数据
  consumer:
    check: false

tushare:
  token: ${TUSHARE_TOKEN}
