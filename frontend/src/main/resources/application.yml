server:
  port: 8090

spring:
  application:
    name: alphafrog-frontend
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${AF_DB_MAIN_HOST}:${AF_DB_MAIN_PORT}/${AF_DB_MAIN_DATABASE}
    username: ${AF_DB_MAIN_USER}
    password: ${AF_DB_MAIN_PASSWORD}
  rabbitmq:
    host: ${AF_RABBITMQ_HOST:localhost}
    port: ${AF_RABBITMQ_PORT:5672}
    username: ${AF_RABBITMQ_USER:guest}
    password: ${AF_RABBITMQ_PASS:guest}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 20

  data:
    redis:
      host: ${AF_REDIS_HOST:127.0.0.1}
      port: ${AF_REDIS_PORT:6379}
      password: ${AF_REDIS_PASSWORD:Excited1s}
      timeout: 30000

jwt:
  secret: ${AF_JWT_SECRET:Secret01234567890123456789012345678901234567890123456789}
  expiration: ${AF_JWT_EXPIRATION:86400000}
  header: Authorization
  token-prefix: Bearer

cors:
  allowed-origins: ${AF_CORS_ALLOWED_ORIGINS:http://localhost:31127}

security:
  rate-limit:
    login-attempts: 5
    login-window-minutes: 10
    task-creation-attempts: 10
    task-creation-window-minutes: 60

alphafrog:
  config:
    nacos:
      enabled: ${AF_CONFIG_NACOS_ENABLED:true}
      server-addr: ${NACOS_ADDRESS:127.0.0.1}:8848
      namespace: ${AF_CONFIG_NACOS_NAMESPACE:}
  rag:
    ingest:
      admin-token: ${AF_RAG_INGEST_TOKEN:}
      external-info-service-url: ${AF_EXTERNAL_INFO_SERVICE_URL:http://alphafrog-external-info-service:18096}

agent:
  run-result:
    cache-ttl-seconds: ${AF_AGENT_RUN_RESULT_CACHE_TTL_SECONDS:30}
  langchain:
    provider:
      dubbo-group: ${AGENT_LANGCHAIN_PROVIDER_DUBBO_GROUP:langchain}

dubbo:
  consumer:
    # 允许 frontend 在部分下游服务暂时不可用时先启动，由具体接口调用返回错误而不是整站启动失败
    check: false
  registry:
    address: nacos://${NACOS_ADDRESS:127.0.0.1}:8848
    # 当前未使用 Nacos 作为 Dubbo 配置中心，显式关闭默认兜底，避免启动时额外做 config-center 健康检查
    use-as-config-center: false
    # 当前未使用 Nacos 作为 Dubbo 元数据中心，显式关闭默认兜底，避免启动时额外做 metadata-center 健康检查
    use-as-metadata-center: false
  #    address: nacos://${NACOS_ADDRESS:127.0.0.1}:8848?username=${NACOS_USERNAME:nacos}&password=${NACOS_PASSWORD:nacos}
  application:
    name: alphafrog-frontend
    # 当前集群沿用 Dubbo 2 风格的接口级服务发现，显式关闭 Dubbo 3 默认的应用级双注册/双订阅
    register-mode: interface
    logger: slf4j
