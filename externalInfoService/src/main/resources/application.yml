server:
  port: 18096

spring:
  application:
    name: external-info-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${AF_DB_MAIN_HOST}:${AF_DB_MAIN_PORT:5432}/${AF_DB_MAIN_DATABASE}
    username: ${AF_DB_MAIN_USER}
    password: ${AF_DB_MAIN_PASSWORD}
  data:
    redis:
      host: ${AF_REDIS_HOST:${SPRING_DATA_REDIS_HOST:redis}}
      port: ${AF_REDIS_PORT:${SPRING_DATA_REDIS_PORT:6379}}
      password: ${AF_REDIS_PASSWORD:${SPRING_DATA_REDIS_PASSWORD:}}

dubbo:
  application:
    name: external-info-service
    # 当前集群沿用 Dubbo 2 风格的接口级服务发现，显式关闭 Dubbo 3 默认的应用级双注册/双订阅
    register-mode: interface
  protocols:
    tri:
      name: tri
      port: 50061
      host: ${DUBBO_PROTOCOL_HOST:}
  registry:
    address: nacos://${NACOS_ADDRESS:127.0.0.1}:8848
    # 当前未使用 Nacos 作为 Dubbo 配置中心，显式关闭默认兜底，避免启动时额外做 config-center 健康检查
    use-as-config-center: false
    # 当前未使用 Nacos 作为 Dubbo 元数据中心，显式关闭默认兜底，避免启动时额外做 metadata-center 健康检查
    use-as-metadata-center: false
  provider:
    timeout: ${AF_EXTERNAL_INFO_DUBBO_PROVIDER_TIMEOUT_MS:60000}

external-info:
  search-llm:
    config-file: ${AF_EXTERNAL_INFO_SEARCH_LLM_CONFIG_FILE:}
    config-refresh-interval-ms: ${AF_EXTERNAL_INFO_SEARCH_LLM_CONFIG_REFRESH_INTERVAL_MS:10000}
    providers:
      perplexity:
        base-url: ${AF_EXTERNAL_INFO_SEARCH_PPLX_BASE_URL:https://api.perplexity.ai}
        api-key: ${AF_EXTERNAL_INFO_SEARCH_PPLX_API_KEY:}
        search-path: ${AF_EXTERNAL_INFO_SEARCH_PPLX_SEARCH_PATH:/search}
        auth-header: ${AF_EXTERNAL_INFO_SEARCH_PPLX_AUTH_HEADER:Authorization}
        auth-prefix: ${AF_EXTERNAL_INFO_SEARCH_PPLX_AUTH_PREFIX:Bearer }
        connect-timeout-seconds: ${AF_EXTERNAL_INFO_SEARCH_PPLX_CONNECT_TIMEOUT_SECONDS:20}
        request-timeout-seconds: ${AF_EXTERNAL_INFO_SEARCH_PPLX_REQUEST_TIMEOUT_SECONDS:45}
      exa:
        base-url: ${AF_EXTERNAL_INFO_SEARCH_EXA_BASE_URL:https://api.exa.ai}
        api-key: ${AF_EXTERNAL_INFO_SEARCH_EXA_API_KEY:}
        search-path: ${AF_EXTERNAL_INFO_SEARCH_EXA_SEARCH_PATH:/search}
        auth-header: ${AF_EXTERNAL_INFO_SEARCH_EXA_AUTH_HEADER:x-api-key}
        auth-prefix: ${AF_EXTERNAL_INFO_SEARCH_EXA_AUTH_PREFIX:}
        connect-timeout-seconds: ${AF_EXTERNAL_INFO_SEARCH_EXA_CONNECT_TIMEOUT_SECONDS:20}
        request-timeout-seconds: ${AF_EXTERNAL_INFO_SEARCH_EXA_REQUEST_TIMEOUT_SECONDS:45}
      tavily:
        base-url: ${AF_EXTERNAL_INFO_SEARCH_TAVILY_BASE_URL:https://api.tavily.com}
        api-key: ${AF_EXTERNAL_INFO_SEARCH_TAVILY_API_KEY:}
        search-path: ${AF_EXTERNAL_INFO_SEARCH_TAVILY_SEARCH_PATH:/search}
        auth-header: ${AF_EXTERNAL_INFO_SEARCH_TAVILY_AUTH_HEADER:Authorization}
        auth-prefix: ${AF_EXTERNAL_INFO_SEARCH_TAVILY_AUTH_PREFIX:Bearer }
        connect-timeout-seconds: ${AF_EXTERNAL_INFO_SEARCH_TAVILY_CONNECT_TIMEOUT_SECONDS:20}
        request-timeout-seconds: ${AF_EXTERNAL_INFO_SEARCH_TAVILY_REQUEST_TIMEOUT_SECONDS:45}
    features:
      market-news:
        default-provider: ${AF_EXTERNAL_INFO_SEARCH_MARKET_NEWS_DEFAULT_PROVIDER:exa}
        default-limit: ${AF_EXTERNAL_INFO_SEARCH_MARKET_NEWS_DEFAULT_LIMIT:8}
        max-results: ${AF_EXTERNAL_INFO_SEARCH_MARKET_NEWS_MAX_RESULTS:20}
        exa-search-type: ${AF_EXTERNAL_INFO_SEARCH_MARKET_NEWS_EXA_TYPE:auto}
        exa-category: ${AF_EXTERNAL_INFO_SEARCH_MARKET_NEWS_EXA_CATEGORY:news}
        profiles:
          - name: cn
            provider: ${AF_EXTERNAL_INFO_SEARCH_MARKET_NEWS_CN_PROVIDER:exa}
            query: ${AF_EXTERNAL_INFO_SEARCH_MARKET_NEWS_CN_QUERY:今日A股市场行情 行业板块热点}
            include-domains: [sina.com.cn, eastmoney.com, cls.cn, yicai.com]
            languages: [zh]
            country: ${AF_EXTERNAL_INFO_SEARCH_MARKET_NEWS_CN_COUNTRY:CN}
            category-hint: market
          - name: policy
            provider: ${AF_EXTERNAL_INFO_SEARCH_MARKET_NEWS_POLICY_PROVIDER:perplexity}
            query: ${AF_EXTERNAL_INFO_SEARCH_MARKET_NEWS_POLICY_QUERY:央行政策公告 金融监管动态}
            include-domains: [pbc.gov.cn, gov.cn]
            languages: [zh]
            country: ${AF_EXTERNAL_INFO_SEARCH_MARKET_NEWS_POLICY_COUNTRY:CN}
            category-hint: policy
          - name: us
            provider: ${AF_EXTERNAL_INFO_SEARCH_MARKET_NEWS_US_PROVIDER:exa}
            query: ${AF_EXTERNAL_INFO_SEARCH_MARKET_NEWS_US_QUERY:US stocks market news}
            include-domains: [wsj.com, bloomberg.com, reuters.com]
            languages: [en]
            country: ${AF_EXTERNAL_INFO_SEARCH_MARKET_NEWS_US_COUNTRY:US}
            category-hint: global
      web-search:
        default-preset: ${AF_EXTERNAL_INFO_WEB_SEARCH_DEFAULT_PRESET:finance_default}
        presets:
          finance_default:
            scene: finance
            backend: ${AF_EXTERNAL_INFO_WEB_SEARCH_FINANCE_BACKEND:perplexity}
            strength: ${AF_EXTERNAL_INFO_WEB_SEARCH_FINANCE_STRENGTH:standard}
            max-results: ${AF_EXTERNAL_INFO_WEB_SEARCH_FINANCE_MAX_RESULTS:8}
            include-domains: [eastmoney.com, cls.cn, yicai.com]
          news_fast:
            scene: news
            backend: ${AF_EXTERNAL_INFO_WEB_SEARCH_NEWS_BACKEND:exa}
            strength: ${AF_EXTERNAL_INFO_WEB_SEARCH_NEWS_STRENGTH:fast}
            max-results: ${AF_EXTERNAL_INFO_WEB_SEARCH_NEWS_MAX_RESULTS:10}
            time-range: day
          general_default:
            scene: general
            backend: ${AF_EXTERNAL_INFO_WEB_SEARCH_GENERAL_BACKEND:perplexity}
            strength: ${AF_EXTERNAL_INFO_WEB_SEARCH_GENERAL_STRENGTH:standard}
            max-results: ${AF_EXTERNAL_INFO_WEB_SEARCH_GENERAL_MAX_RESULTS:5}
        backends:
          perplexity:
            base-url: ${AF_EXTERNAL_INFO_SEARCH_PPLX_BASE_URL:https://api.perplexity.ai}
            auth-header: ${AF_EXTERNAL_INFO_SEARCH_PPLX_AUTH_HEADER:Authorization}
            auth-prefix: ${AF_EXTERNAL_INFO_SEARCH_PPLX_AUTH_PREFIX:Bearer }
            connect-timeout-seconds: ${AF_EXTERNAL_INFO_SEARCH_PPLX_CONNECT_TIMEOUT_SECONDS:20}
            request-timeout-seconds: ${AF_EXTERNAL_INFO_SEARCH_PPLX_REQUEST_TIMEOUT_SECONDS:45}
          exa:
            base-url: ${AF_EXTERNAL_INFO_SEARCH_EXA_BASE_URL:https://api.exa.ai}
            auth-header: ${AF_EXTERNAL_INFO_SEARCH_EXA_AUTH_HEADER:x-api-key}
            auth-prefix: ${AF_EXTERNAL_INFO_SEARCH_EXA_AUTH_PREFIX:}
            connect-timeout-seconds: ${AF_EXTERNAL_INFO_SEARCH_EXA_CONNECT_TIMEOUT_SECONDS:20}
            request-timeout-seconds: ${AF_EXTERNAL_INFO_SEARCH_EXA_REQUEST_TIMEOUT_SECONDS:45}
          tavily:
            base-url: ${AF_EXTERNAL_INFO_SEARCH_TAVILY_BASE_URL:https://api.tavily.com}
            auth-header: ${AF_EXTERNAL_INFO_SEARCH_TAVILY_AUTH_HEADER:Authorization}
            auth-prefix: ${AF_EXTERNAL_INFO_SEARCH_TAVILY_AUTH_PREFIX:Bearer }
            connect-timeout-seconds: ${AF_EXTERNAL_INFO_SEARCH_TAVILY_CONNECT_TIMEOUT_SECONDS:20}
            request-timeout-seconds: ${AF_EXTERNAL_INFO_SEARCH_TAVILY_REQUEST_TIMEOUT_SECONDS:45}
    prompts:
      market-news-query-template: ${AF_EXTERNAL_INFO_SEARCH_PROMPTS_MARKET_NEWS_QUERY_TEMPLATE:}

alphafrog:
  rag:
    ingest:
      qdrant-host: ${AF_QDRANT_HOST:shared-qdrant}
      qdrant-http-port: ${AF_QDRANT_HTTP_PORT:6333}
      qdrant-collection: ${AF_RAG_QDRANT_COLLECTION:alphafrog_rag}
      embedding-dim: ${AF_RAG_EMBEDDING_DIM:1024}
    oss:
      endpoint: ${AF_OSS_ENDPOINT:oss-ap-southeast-1-internal.aliyuncs.com}
      bucket: ${AF_OSS_BUCKET:}
      access-key-id: ${AF_OSS_ACCESS_KEY_ID:}
      access-key-secret: ${AF_OSS_ACCESS_KEY_SECRET:}
      path-prefix: ${AF_OSS_PATH_PREFIX:alphafrog-rag}
    # RAG 语义检索（P7-05）：Qdrant gRPC 连接 + Embedding API
    # host/collection 须与 ingest 侧保持一致（即与 AF_QDRANT_HOST 及 AF_RAG_QDRANT_COLLECTION 同一组）
    qdrant:
      host: ${AF_QDRANT_HOST:shared-qdrant}
      port: ${AF_QDRANT_PORT:6334}
      collection: ${AF_QDRANT_COLLECTION:alphafrog_rag}
    embedding:
      base-url: ${AF_EMBEDDING_BASE_URL:https://api.openai.com/v1}
      api-key: ${AF_EMBEDDING_API_KEY:}
      model: ${AF_EMBEDDING_MODEL:text-embedding-3-small}
      # 必须与 P7-03 ingestion 脚本使用的维度一致；默认使用压缩后的 1024 维
      dimensions: ${AF_EMBEDDING_DIMENSIONS:1024}
      # 热加载 JSON 配置文件路径（本地 json 中的非空值覆盖上方环境变量默认值）
      config-file: ${AF_RAG_EMBEDDING_CONFIG_FILE:}
      config-refresh-interval-ms: ${AF_RAG_EMBEDDING_CONFIG_REFRESH_INTERVAL_MS:10000}

logging:
  level:
    world.willfrog.externalinfo: ${LOGGING_LEVEL_EXTERNAL_INFO:INFO}
